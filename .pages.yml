media:
  input: src/assets/img
  output: /assets/img
  categories: [image]
  rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user

content:
  - name: home
    label: Home page
    type: file
    path: src/content/index.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: description
        type: text
        required: true
      - name: hero
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: title
            type: string
          - name: lede
            type: text
          - name: text
            type: text
          - name: image
            type: image
          - name: alt
            label: Image alt text
            type: string
          - name: primary
            type: object
            fields:
              - name: label
                type: string
              - name: key
                type: string
          - name: secondary
            type: object
            fields:
              - name: label
                type: string
              - name: href
                type: string
          - name: meta
            label: Course facts
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {value}"
            fields:
              - name: value
                type: string
              - name: icon
                type: string
              - name: label
                type: string
      - name: invitation
        type: object
        fields:
          - name: title
            type: string
          - name: text
            type: text
      - name: value
        label: Why this course
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: title
            type: string
          - name: text
            type: text
          - name: cards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                type: string
              - name: icon
                type: string
              - name: text
                type: text
      - name: visionary
        label: Gary Bedford section
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: title
            type: string
          - name: text
            type: text
          - name: bio
            type: text
          - name: image
            type: image
          - name: alt
            label: Image alt text
            type: string
          - name: links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                type: string
              - name: key
                type: string
              - name: note
                type: string
      - name: steps
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: title
            type: string
          - name: items
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{number}: {title}"
            fields:
              - name: number
                type: string
              - name: title
                type: string
              - name: text
                type: text
      - name: faq
        label: FAQ
        type: object
        fields:
          - name: title
            type: string
          - name: items
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{q}"
            fields:
              - name: q
                label: Question
                type: string
              - name: a
                label: Answer
                type: text
      - name: closing
        type: object
        fields:
          - name: title
            type: string
          - name: text
            type: text
          - name: primary
            type: object
            fields:
              - name: label
                type: string
              - name: key
                type: string

  - name: course
    label: Course curriculum
    type: file
    path: src/_data/course.yaml
    format: yaml
    operations:
      delete: false
    fields:
      - name: name
        type: string
        required: true
      - name: chapterCount
        label: Chapter count
        type: number
      - name: lessonCount
        label: Lesson count
        type: number
      - name: price
        type: string
      - name: format
        type: string
      - name: chapters
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Chapter {number}: {title}"
        fields:
          - name: number
            type: number
          - name: title
            type: string
          - name: blurb
            type: text
          - name: lessons
            type: string
            list: true

  - name: links
    label: Links
    type: file
    path: src/_data/links.yaml
    format: yaml
    operations:
      delete: false
    fields:
      - name: enroll
        label: Enrollment URL
        type: string
      - name: course
        label: Course URL
        type: string
      - name: lxp
        label: Learning platform URL
        type: string
      - name: project
        label: Project URL
        type: string
      - name: blog
        label: Explore blog URL
        type: string
      - name: foundation
        label: Foundation URL
        type: string
      - name: author
        label: Gary Bedford URL
        type: string
